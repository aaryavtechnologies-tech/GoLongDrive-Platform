<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- soft backdrop -->
  <circle cx="160" cy="160" r="140" fill="#141414"/>
  <circle cx="160" cy="160" r="140" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- dashed route -->
  <path d="M 95 220 Q 130 150 165 170 T 225 110" fill="none" stroke="#3A3A3A" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- origin pin -->
  <g transform="translate(95,205)">
    <path d="M0 0 C -12 0 -20 -9 -20 -20 C -20 -32 -11 -40 0 -40 C 11 -40 20 -32 20 -20 C 20 -9 12 0 0 0 Z" fill="#F5B300"/>
    <circle cx="0" cy="-22" r="7" fill="#000000"/>
  </g>

  <!-- destination pin -->
  <g transform="translate(228,96)">
    <path d="M0 0 C -10 0 -16 -7 -16 -16 C -16 -25 -9 -32 0 -32 C 9 -32 16 -25 16 -16 C 16 -7 10 0 0 0 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="-17" r="5.5" fill="#000000"/>
  </g>

  <!-- car body -->
  <g transform="translate(120,185)">
    <rect x="0" y="18" width="90" height="30" rx="10" fill="#FFFFFF"/>
    <path d="M14 18 L28 -4 C31 -8 36 -10 41 -10 L59 -10 C64 -10 69 -8 72 -4 L86 18 Z" fill="#FFFFFF"/>
    <rect x="30" y="0" width="40" height="12" rx="3" fill="#F5B300"/>
    <circle cx="20" cy="50" r="9" fill="#000000"/>
    <circle cx="20" cy="50" r="4" fill="#F5B300"/>
    <circle cx="70" cy="50" r="9" fill="#000000"/>
    <circle cx="70" cy="50" r="4" fill="#F5B300"/>
    <rect x="6" y="26" width="10" height="6" rx="2" fill="#F5B300"/>
    <rect x="74" y="26" width="10" height="6" rx="2" fill="#F5B300"/>
  </g>

  <!-- phone frame -->
  <g transform="translate(196,168)">
    <rect x="0" y="0" width="70" height="118" rx="16" fill="#000000" stroke="#F5B300" stroke-width="3"/>
    <rect x="9" y="14" width="52" height="78" rx="6" fill="#1B1B1B"/>
    <circle cx="35" cy="104" r="4" fill="#F5B300"/>
    <path d="M20 55 Q35 38 50 55" fill="none" stroke="#F5B300" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="70" r="5" fill="#FFFFFF"/>
