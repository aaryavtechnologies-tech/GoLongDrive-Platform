<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- soft backdrop -->
  <circle cx="160" cy="160" r="140" fill="#141414"/>
  <circle cx="160" cy="160" r="140" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- wallet body -->
  <g transform="translate(75,140)">
    <rect x="0" y="20" width="170" height="110" rx="18" fill="#FFFFFF"/>
    <path d="M0 40 L0 20 C0 9 9 0 20 0 L150 0 C161 0 170 9 170 20 L170 40 Z" fill="#F5B300"/>
    <rect x="120" y="55" width="60" height="42" rx="10" fill="#000000"/>
    <circle cx="150" cy="76" r="9" fill="#F5B300"/>
  </g>

  <!-- card sticking out top -->
  <g transform="translate(150,90) rotate(-8)">
    <rect x="0" y="0" width="100" height="62" rx="10" fill="#0D0D0D" stroke="#F5B300" stroke-width="2.5"/>
    <rect x="12" y="14" width="24" height="16" rx="3" fill="#F5B300"/>
    <rect x="12" y="40" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
    <rect x="12" y="50" width="36" height="5" rx="2.5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- coin stack -->
  <g transform="translate(90,225)">
    <ellipse cx="0" cy="18" rx="26" ry="9" fill="#D99A00"/>
    <ellipse cx="0" cy="9" rx="26" ry="9" fill="#F5B300"/>
    <ellipse cx="0" cy="0" rx="26" ry="9" fill="#FFD65C"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">$</text>
  </g>

  <!-- success checkmark chip -->
  <g transform="translate(240,205)">
    <circle cx="0" cy="0" r="24" fill="#F5B300"/>
    <path d="M-9 0 L-2 7 L11 -9" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- decorative dots -->
  <circle cx="60" cy="90" r="4" fill="#F5B300" opacity="0.6"/>
  <circle cx="250" cy="100" r="4" fill="#FFFFFF" opacity="0.5"/>
</svg>
