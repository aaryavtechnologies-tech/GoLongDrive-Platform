<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- soft backdrop -->
  <circle cx="160" cy="160" r="140" fill="#141414"/>
  <circle cx="160" cy="160" r="140" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- map card -->
  <rect x="55" y="65" width="210" height="190" rx="18" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/>

  <!-- roads -->
  <path d="M55 150 H265" stroke="#2A2A2A" stroke-width="10"/>
  <path d="M55 150 H265" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M150 65 V255" stroke="#2A2A2A" stroke-width="10"/>
  <path d="M150 65 V255" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- pulse rings around car -->
  <circle cx="150" cy="150" r="26" fill="none" stroke="#F5B300" stroke-width="2" opacity="0.35"/>
  <circle cx="150" cy="150" r="40" fill="none" stroke="#F5B300" stroke-width="2" opacity="0.2"/>

  <!-- car top-down view -->
  <g transform="translate(150,150)">
    <rect x="-14" y="-24" width="28" height="48" rx="9" fill="#F5B300"/>
    <rect x="-9" y="-16" width="18" height="14" rx="3" fill="#000000"/>
    <rect x="-9" y="4" width="18" height="12" rx="3" fill="#000000"/>
  </g>

  <!-- destination pin -->
  <g transform="translate(210,105)">
    <path d="M0 0 C -11 0 -18 -8 -18 -18 C -18 -29 -10 -36 0 -36 C 10 -36 18 -29 18 -18 C 18 -8 11 0 0 0 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="-19" r="6" fill="#000000"/>
  </g>

  <!-- ETA chip -->
  <g transform="translate(95,205)">
    <rect x="0" y="0" width="72" height="30" rx="15" fill="#F5B300"/>
    <text x="36" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">4 min</text>
  </g>

  <!-- decorative dots -->
  <circle cx="245" cy="230" r="4" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="65" cy="90" r="3" fill="#F5B300" opacity="0.6"/>
</svg>
