name: golongdrive
description: GoLongDrive Driver App - Flutter UI recreation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  http: ^1.2.0
  url_launcher: ^6.3.2
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.1.2
  audioplayers: ^6.0.0
  toastification: ^3.2.0
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - .env

flutter_native_splash:
  color: "#000000"
  image: assets/images/app_icon.jpg
  android_12:
    color: "#000000"
    image: assets/images/app_icon.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21
